<!DOCTYPE html>
<html>
<head>
    <title>Spam SMS Detector</title>
    <style>
        body { font-family: Arial; background: #f2f2f2; text-align: center; padding-top: 100px; }
        .box { background: white; padding: 30px; width: 400px; margin: auto; border-radius: 10px; }
        textarea { width: 100%; height: 100px; }
        button { padding: 10px 20px; margin-top: 10px; }
        h2 { color: #333; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Spam SMS Detector</h2>
        <form method="POST">
            <textarea name="sms" placeholder="Enter SMS here..." required>{{ sms }}</textarea>
            <button type="submit">Check</button>
        </form>
        {% if prediction %}
            <h3>Result: {{ prediction }}</h3>
        {% endif %}
    </div>
</body>
</html>
